name: sac_pushcube_realonly_matched_20k
seed: 0
env:
  backend: maniskill
  id: PushCube-v1
  obs_mode: state
  robot_uids: panda
  control_mode: pd_ee_delta_pos
  reward_mode: normalized_dense
  sim_backend: gpu
  num_envs: 32
algo:
  hidden_dims: [256, 256, 256]
  actor_lr: 0.0003
  critic_lr: 0.0003
  alpha_lr: 0.0003
  gamma: 0.8
  tau: 0.01
  initial_alpha: 1.0
training:
  device: cuda:0
  real_env_steps: 20000
  batch_size: 1024
  replay_capacity: 500000
  learning_starts: 4000
  utd: 0.5
  checkpoint_every: 5000
  log_every: 1000
  torch_threads: 1
evaluation:
  episodes: 20
  seed: 0
  interval: 5000
  termination_policy: terminate_on_success
tracking:
  mode: offline
  project: dynamics-shift
  video_every: 5000
  video_episodes: 2
  video_seed: 21000
