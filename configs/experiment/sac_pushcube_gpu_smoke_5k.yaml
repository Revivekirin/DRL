name: sac_pushcube_gpu_smoke_5k

seed: 0

env:
  backend: maniskill
  id: PushCube-v1
  obs_mode: state
  robot_uids: panda
  control_mode: pd_ee_delta_pos
  reward_mode: normalized_dense
  sim_backend: gpu
  num_envs: 32

algo:
  hidden_dims: [256, 256]
  actor_lr: 0.0003
  critic_lr: 0.0003
  alpha_lr: 0.0003
  gamma: 0.99
  tau: 0.005
  initial_alpha: 0.2
  target_entropy: null

training:
  device: cuda:0
  real_env_steps: 5120
  batch_size: 256
  replay_capacity: 500000
  learning_starts: 1024
  utd: 0.5
  log_every: 1024
  torch_threads: 1
  checkpoint_every: 2560

evaluation:
  episodes: 5
  seed: 0
  interval: 2560
  termination_policy: terminate_on_success

tracking:
  mode: disabled
  video_every: 0