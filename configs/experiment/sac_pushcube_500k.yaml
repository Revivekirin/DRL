name: sac_pushcube_nominal_500k

seed: 0

env:
  backend: maniskill
  id: PushCube-v1
  obs_mode: state
  robot_uids: panda
  control_mode: pd_ee_delta_pos
  reward_mode: normalized_dense
  sim_backend: gpu
  num_envs: 32

algo:
  hidden_dims: [256, 256]
  actor_lr: 0.0003
  critic_lr: 0.0003
  alpha_lr: 0.0003
  gamma: 0.99
  tau: 0.005
  initial_alpha: 0.2
  target_entropy: null

training:
  device: cuda:0
  real_env_steps: 500000
  batch_size: 256
  replay_capacity: 500000
  learning_starts: 5000
  utd: 0.5
  log_every: 1000
  torch_threads: 1
  checkpoint_every: 50000

evaluation:
  episodes: 20
  seed: 0
  interval: 50000
  termination_policy: terminate_on_success

tracking:
  mode: disabled
  video_every: 0