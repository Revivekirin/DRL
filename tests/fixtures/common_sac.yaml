schema_version: 1
algorithm: sac
name: common_sac_smoke
seed: 0
env:
  backend: maniskill
  id: PushCube-v1
  obs_mode: state
  robot_uids: panda
  control_mode: pd_ee_delta_pos
  reward_mode: normalized_dense
  sim_backend: gpu
  num_envs: 4
sac:
  hidden_dims: [256, 256, 256]
  gamma: 0.8
  tau: 0.01
  initial_alpha: 1.0
training:
  device: cuda:0
  real_env_steps: 800
  batch_size: 64
  replay_capacity: 1024
  learning_starts: 128
  utd: 0.5
  checkpoint_every: 400
  log_every: 100
  torch_threads: 1
evaluation:
  episodes: 3
  seed: 20000
  interval: 400
  termination_policy: terminate_on_success
tracking:
  mode: offline
  video_every: 400
  video_episodes: 2
  video_seed: 21000
