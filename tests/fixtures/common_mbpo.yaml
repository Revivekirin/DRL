schema_version: 1
algorithm: mbpo
name: common_mbpo_smoke
seed: 0
env:
  backend: maniskill
  id: PushCube-v1
  obs_mode: state
  robot_uids: panda
  control_mode: pd_ee_delta_pos
  reward_mode: normalized_dense
  sim_backend: gpu
  num_envs: 4
sac:
  hidden_dims: [256, 256, 256]
  gamma: 0.8
  tau: 0.01
  initial_alpha: 1.0
training:
  device: cuda:0
  real_env_steps: 800
  batch_size: 64
  replay_capacity: 1024
  learning_starts: 128
  utd: 0.5
  checkpoint_every: 400
  log_every: 100
  torch_threads: 1
model:
  ensemble_size: 3
  elite_size: 2
  model_hidden_dims: [64, 64]
  model_batch_size: 64
  model_max_epochs: 2
  model_patience: 2
  model_max_samples: 1024
  model_train_frequency: 200
  holdout_ratio: 0.2
  rollout_horizon: 1
  rollout_batch_size: 128
  model_replay_capacity: 256
  real_ratio: 0.5
evaluation:
  episodes: 3
  seed: 20000
  interval: 400
  termination_policy: terminate_on_success
tracking:
  mode: offline
  video_every: 400
  video_episodes: 2
  video_seed: 21000
