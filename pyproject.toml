[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamics-shift"
version = "0.1.0"
description = "Controlled HalfCheetah actuator-shift validation"
requires-python = ">=3.12"
dependencies = [
    "gymnasium[mujoco]==1.3.0",
    "mujoco==3.14.0",
    "numpy==2.5.3",
    "PyYAML==6.0.3",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
maniskill = ["mani-skill==3.0.1"]
test = ["pytest==9.1.1"]
tracking = ["wandb>=0.19,<1", "imageio[ffmpeg]>=2.34,<3", "moviepy>=2,<3"]
analysis = ["matplotlib>=3.9,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

markers = ["training: runs model fitting or learner updates; requires --run-training on the remote server"]
